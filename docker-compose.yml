services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: sqlite:///./agronova.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DEMO_MODE: "true"
      WEATHER_PROVIDER: demo
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - agronova-data:/app/data

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_DEMO_MODE: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules

volumes:
  agronova-data:
  frontend-modules:
